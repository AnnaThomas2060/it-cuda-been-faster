# Stage 1 SFT LoRA Configuration
# Fine-tunes the base coder model on verified training-task teacher kernels.
model_name_or_path: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
use_dev_model: false
lora_r: 8
lora_alpha: 16
lora_dropout: 0.0
target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
learning_rate: 1.0e-6
num_epochs: 1
max_seq_length: 3072
optimizer: "adamw"
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
weight_decay: 0.01
warmup_ratio: 0.05
max_grad_norm: 1.0
logging_steps: 1
save_strategy: "epoch"
device: "cuda:0"
output_dir: "./outputs/sft_warmup"
training_tasks:
  - "swish"
  - "column_max"
  - "channel_rmsnorm"
seed: 635
