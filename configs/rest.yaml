# Reinforced Self-Training (ReST) Configuration
# Iterative correctness-filtered data generation and policy improvement.
model_name_or_path: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
use_dev_model: false
lora_r: 8
lora_alpha: 16
num_iterations: 2
rollouts_per_task: 4
refinement_turns: 2
temperature: 0.8
top_p: 0.95
speedup_thresholds:
  - 1.00
  - 1.05
max_kept_per_task: 4
max_seq_length: 4096
max_prompt_length: 3072
max_completion_length: 1024
rollout_batch_size: 1
learning_rate: 1.0e-6
batch_size: 1
device: "cuda:0"
verifier_device: "cuda:1"
output_dir: "./outputs/rest_selftrain"
training_tasks:
  - "swish"
  - "column_max"
  - "channel_rmsnorm"
seed: 635
